<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inference pipeline · Flowchart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · RNV segmentation</p>
    <h1>Inference pipeline: seeds decide, the seedless network extends</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inference-pipeline-title inference-pipeline-desc">
        <title id="inference-pipeline-title">RNV inference pipeline</title>
        <desc id="inference-pipeline-desc">An image with localization points gets a seed-conditioned probability map fused with the seedless network's map, then threshold, relax fallback, claiming and seed hull produce the mask; an image with no points takes the seedless network's mask directly.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <line x1="520" y1="76" x2="520" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="520" y1="152" x2="520" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="520" y1="264" x2="520" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="520" y1="344" x2="520" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="520" y1="420" x2="520" y2="444" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="520" y1="496" x2="520" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="520" y1="572" x2="520" y2="596" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Decision NO -> no-point mask -->
        <line x1="620" y1="220" x2="760" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Seedless P -> no-point mask -->
        <path d="M640 126 H872 Q880 126 880 134 V194" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Seedless P -> fusion -->
        <path d="M400 126 H360 Q352 126 352 134 V386 Q352 394 360 394 H400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- No-point mask -> lesion mask -->
        <path d="M880 246 V610 Q880 618 872 618 H640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="528" y="272" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="544" y="281" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="676" y="200" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="688" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="740" y="106" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="778" y="115" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEEDLESS P</text>
        <rect x="264" y="254" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="304" y="263" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEEDLESS P</text>

        <!-- Start oval: image + points -->
        <rect x="400" y="32" width="240" height="44" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="520" y="51" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OCTA image + points</text>
        <text x="520" y="65" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1024² en-face · 0–113 points</text>

        <!-- Seedless U-Net -->
        <rect x="400" y="100" width="240" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="100" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="106" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="422" y="115" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NET</text>
        <text x="520" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Seedless U-Net</text>
        <text x="520" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">whole frame, no seed input</text>

        <!-- Decision: any points? -->
        <polygon points="520,176 620,220 520,264 420,220" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="520" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Any points?</text>

        <!-- Seed-conditioned U-Net (focal) -->
        <rect x="400" y="292" width="240" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="292" width="240" height="52" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="408" y="298" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="422" y="307" fill="rgba(191,69,32,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NET</text>
        <text x="520" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Seed-conditioned U-Net</text>
        <text x="520" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">512² patch + seed heat-map → P</text>

        <!-- Fusion (focal, stage 4a) -->
        <rect x="400" y="368" width="240" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="368" width="240" height="52" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="408" y="374" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="422" y="383" fill="rgba(191,69,32,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">4A</text>
        <text x="520" y="394" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fusion</text>
        <text x="520" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">P = max(P, seedless P &gt; 0.9)</text>

        <!-- Threshold & relax (stages 5-6) -->
        <rect x="400" y="444" width="240" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="444" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="450" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="422" y="459" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">5–6</text>
        <text x="520" y="470" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Threshold &amp; relax</text>
        <text x="520" y="486" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">P &gt; 0.5 · relax 0.20 · close, fill</text>

        <!-- Claim & hull (stages 7-8) -->
        <rect x="400" y="520" width="240" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="520" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="526" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="422" y="535" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">7–8</text>
        <text x="520" y="546" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claim &amp; hull</text>
        <text x="520" y="562" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">boundary claim · hull 128 px</text>

        <!-- No-point mask (stage 9) -->
        <rect x="760" y="194" width="240" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="194" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="768" y="200" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="782" y="209" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">9</text>
        <text x="880" y="218" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">No-point mask</text>
        <text x="880" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">seedless P &gt; 0.40 · close, fill</text>

        <!-- End oval: lesion mask -->
        <rect x="400" y="596" width="240" height="44" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="520" y="615" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lesion mask</text>
        <text x="520" y="629" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scored against ground truth</text>

        <!-- Legend -->
        <line x1="40" y1="664" x2="1240" y2="664" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="680" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE · TAG = SPEC STAGE</text>

        <rect x="40" y="692" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="702" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input / output</text>

        <rect x="200" y="692" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="702" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

        <polygon points="320,698 332,692 344,698 332,704" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="702" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

        <rect x="448" y="692" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="480" y="702" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Where the score comes from: the seeded network and the fusion</text>

        <line x1="820" y1="700" x2="848" y2="700" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="856" y="702" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow; claiming drops any seedless blob no seed reaches</text>
      </svg>
    </div>
  </div>
</body>
</html>
